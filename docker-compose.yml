services:
  redis:
    image: redis:7-alpine
    container_name: layarplus-redis
    ports:
      - "6379:6379"
    restart: unless-stopped


  silentium:
    image: quay.io/radityprtama/silentium:latest
    container_name: silentium
    ports:
      - "8191:8191"
    environment:
      - HEADLESS=true
    restart: unless-stopped

  api:
    image: quay.io/radityprtama/layarplus-api:latest
    container_name: idlix-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - STEALTH_API_URL=http://silentium:8191
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379
    depends_on:
      - silentium
      - redis
    restart: unless-stopped
